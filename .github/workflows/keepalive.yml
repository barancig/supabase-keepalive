name: Supabase Keep-Alive

on:
  schedule:
    - cron: '23 7 * * *'    # Daily 7:23am UTC
    - cron: '47 19 * * *'   # Daily 7:47pm UTC - redundant safety net
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:

      - name: Ping Master Projects
        env:
          URL: ${{ secrets.SUPABASE_URL_1 }}
          KEY: ${{ secrets.SUPABASE_KEY_1 }}
        run: |
          DAY=$(date +%u)

          echo "--- INSERT keep_alive ---"
          curl -s -o /dev/null -w "%{http_code}\n" -X POST "$URL/rest/v1/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true

          sleep $((RANDOM % 5 + 1)) || true

          echo "--- SELECT eats_restaurants ---"
          curl -s -o /dev/null -w "%{http_code}\n" \
            "$URL/rest/v1/eats_restaurants?select=id,name&limit=5" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true

          sleep $((RANDOM % 4 + 1)) || true

          # Rotated read over tables the app keeps (Phase 1b, 2026-10-18: the
          # dormant eats_config, eats_conversations and eats_ai_flags were dropped).
          if [ "$DAY" = "1" ] || [ "$DAY" = "4" ]; then
            echo "--- SELECT eats_users ---"
            curl -s -o /dev/null -w "%{http_code}\n" \
              "$URL/rest/v1/eats_users?select=user_id&limit=2" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true
          elif [ "$DAY" = "2" ] || [ "$DAY" = "5" ]; then
            echo "--- SELECT eats_local_restaurants ---"
            curl -s -o /dev/null -w "%{http_code}\n" \
              "$URL/rest/v1/eats_local_restaurants?select=place_id&limit=5" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true
          else
            echo "--- SELECT eats_user_data ---"
            curl -s -o /dev/null -w "%{http_code}\n" \
              "$URL/rest/v1/eats_user_data?select=restaurant_id&limit=5" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true
          fi

          sleep $((RANDOM % 3 + 1)) || true

          echo "--- DELETE old keep_alive rows ---"
          curl -s -o /dev/null -w "%{http_code}\n" -X DELETE \
            "$URL/rest/v1/keep_alive?pinged_at=lt.$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Prefer: return=minimal" || true

          echo "Master Projects done."

      - name: Ping Voiding Diary
        env:
          URL: ${{ secrets.SUPABASE_URL_2 }}
          KEY: ${{ secrets.SUPABASE_KEY_2 }}
        run: |
          DAY=$(date +%u)

          echo "--- INSERT keep_alive ---"
          curl -s -o /dev/null -w "%{http_code}\n" -X POST "$URL/rest/v1/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true

          sleep $((RANDOM % 5 + 1)) || true

          echo "--- SELECT entries ---"
          curl -s -o /dev/null -w "%{http_code}\n" \
            "$URL/rest/v1/entries?select=id&limit=5" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true

          sleep $((RANDOM % 4 + 1)) || true

          if [ "$DAY" = "1" ] || [ "$DAY" = "4" ]; then
            echo "--- SELECT diary_groups ---"
            curl -s -o /dev/null -w "%{http_code}\n" \
              "$URL/rest/v1/diary_groups?select=id&limit=5" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true
          elif [ "$DAY" = "2" ] || [ "$DAY" = "5" ]; then
            echo "--- SELECT diary_confirmations ---"
            curl -s -o /dev/null -w "%{http_code}\n" \
              "$URL/rest/v1/diary_confirmations?select=id&limit=5" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true
          else
            echo "--- SELECT keep_alive ---"
            curl -s -o /dev/null -w "%{http_code}\n" \
              "$URL/rest/v1/keep_alive?select=id&limit=5" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true
          fi

          sleep $((RANDOM % 3 + 1)) || true

          echo "--- DELETE old keep_alive rows ---"
          curl -s -o /dev/null -w "%{http_code}\n" -X DELETE \
            "$URL/rest/v1/keep_alive?pinged_at=lt.$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Prefer: return=minimal" || true

          echo "Voiding Diary done."

  # Keeps this repository's schedule from being switched off after 60 days
  # without a commit (Gary's ruling 2026-08-15: commit mode, 45 days). Replaces
  # the hand-made README date bumps.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: false
          time_elapsed: '45'
